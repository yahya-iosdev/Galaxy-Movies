<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - GALAXY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>
<body id="app-body" class="mode-a">
    
    <nav>
        <div class="nav-left">
            <div class="site-logo"><span>GALAXY</span></div>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="genre.html">GENRE</a></li>
                <li><a href="watchlist.html">WATCHLIST</a></li>
                <li><a href="profile.html" class="active">PROFILE</a></li>
            </ul>
        </div>
        <div class="actions">
            <button onclick="setModeA()" title="Light Mode"><i class="fas fa-sun"></i></button>
            <button onclick="setModeB()" title="Dark Mode"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <div class="wrapper auth-container">
        <div class="auth-box">
            <h2>User Profile</h2>
            
          
            <div id="loggedInView" style="display: none;">
                <table class="profile-table">
                    <tr>
                        <td><label for="pName">Full Name:</label></td>
                        <td><input type="text" id="pName" placeholder="Enter your name"></td>
                    </tr>
                    <tr>
                        <td><label for="pEmail">Email Address:</label></td>
                        <td><input type="email" id="pEmail" placeholder="Enter your email"></td>
                    </tr>
                    <tr>
                        <td><label for="pPass">Password:</label></td>
                        <td><input type="password" id="pPass" placeholder="Enter your Password"></td>
                    </tr>
                </table>
                <button class="btn-main" onclick="saveProfile()">Save Changes</button>
                <button class="btn-main btn-secondary" onclick="logout()">Log Out</button>
            </div>

           
            <div id="guestView" style="display: none;">
                <p style="margin-bottom: 20px; color: #888;">You are currently browsing as a guest. Please log in or create an account to view and edit your profile.</p>
                <a href="login.html"><button class="btn-main">Go to Login</button></a>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
    <script>
      
        window.addEventListener('load', () => {
            const isGuest = localStorage.getItem('isGuest');
            
            if (isGuest === 'false' && localStorage.getItem('uEmail')) {
               
                document.getElementById('loggedInView').style.display = 'block';
                document.getElementById('pName').value = localStorage.getItem('uName') || '';
                document.getElementById('pEmail').value = localStorage.getItem('uEmail') || '';
                document.getElementById('pPass').value = localStorage.getItem('uPass') || '';
            } else {
              
                document.getElementById('guestView').style.display = 'block';
            }
        });

        function saveProfile() {
            localStorage.setItem('uName', document.getElementById('pName').value);
            localStorage.setItem('uEmail', document.getElementById('pEmail').value);
            localStorage.setItem('uPass', document.getElementById('pPass').value);
            alert("Profile Updated Successfully!");
        }
    </script>
</body>
</html>
